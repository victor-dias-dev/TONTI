name: Bug
description: Report a defect
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Portuguese and English are both welcome.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
