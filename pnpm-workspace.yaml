packages:
  - 'apps/*'
  - 'packages/*'

nodeLinker: hoisted
strictPeerDependencies: false

overrides:
  deepmerge-ts: 8.0.2
  image-size: 2.0.4
  multer: 2.4.0

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
