<body class="bg-background text-on-background font-body-md antialiased pb-[80px]">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-margin py-stack-gap fixed top-0 left-0 z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md">
<div class="flex items-center gap-3">
<button class="text-on-surface-variant hover:bg-surface-container-high/50 p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Categorias</h1>
</div>
<button class="text-primary hover:bg-surface-container-high/50 px-4 py-2 rounded-full transition-colors flex items-center gap-2 font-label-md text-label-md">
<span class="material-symbols-outlined text-[18px]" data-icon="add" style="font-variation-settings: 'FILL' 0;">add</span>
            Nova
        </button>
</header>
<main class="pt-[88px] px-container-margin pb-safe max-w-2xl mx-auto w-full">
<!-- Tabs -->
<div class="flex bg-surface-container-low rounded-xl p-1 mb-6 mt-2 relative">
<button class="flex-1 py-2.5 text-center font-label-md text-label-md rounded-lg bg-surface tonti-glow text-primary transition-all duration-300">
                Despesas
            </button>
<button class="flex-1 py-2.5 text-center font-label-md text-label-md rounded-lg text-on-surface-variant hover:text-primary transition-all duration-300">
                Receitas
            </button>
</div>
<!-- Categories List -->
<div class="space-y-4">
<!-- Category Item: Alimentação -->
<div class="group bg-surface-container-lowest rounded-[16px] p-4 flex items-center justify-between tonti-glow hover:-translate-y-0.5 transition-transform duration-200 cursor-pointer">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[24px]" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-background">Alimentação</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">12 transações este mês</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity p-2 md:opacity-100">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
<!-- Category Item: Moradia -->
<div class="group bg-surface-container-lowest rounded-[16px] p-4 flex items-center justify-between tonti-glow hover:-translate-y-0.5 transition-transform duration-200 cursor-pointer">

<div class="w-12 h-12 rounded-full bg-[#E3F2FD]/50 flex items-center justify-center text-[#1565C0]">
<span class="material-symbols-outlined text-[24px]" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div>

<p class="font-body-md text-body-md text-on-surface-variant text-sm">4 transações este mês</p>
</div>
</div>

<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
<!-- Category Item: Transporte -->
<div class="group bg-surface-container-lowest rounded-[16px] p-4 flex items-center justify-between tonti-glow hover:-translate-y-0.5 transition-transform duration-200 cursor-pointer">

<div class="w-12 h-12 rounded-full bg-[#FFF3E0]/50 flex items-center justify-center text-[#E65100]">
<span class="material-symbols-outlined text-[24px]" data-icon="directions_car" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-background">Transporte</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">8 transações este mês</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity p-2 md:opacity-100">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>

<div class="w-12 h-12 rounded-full bg-[#F3E5F5]/50 flex items-center justify-center text-[#6A1B9A]">
<span class="material-symbols-outlined text-[24px]" data-icon="sports_esports" style="font-variation-settings: 'FILL' 1;">sports_esports</span>
</div>
<div>

<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
</main>
