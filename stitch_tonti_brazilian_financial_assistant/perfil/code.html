</div>

<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="person_edit">person_edit</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Editar perfil</h3>
<p class="font-body-sm text-sm text-on-surface-variant">Atualize suas informações</p>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="bg-surface-container-lowest rounded-[16px] p-[20px] tonti-glow flex items-center justify-between hover:bg-surface-container-low transition-colors w-full text-left">

<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
