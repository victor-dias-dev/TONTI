<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Tonti - Selecionar Instituição</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#e9c400",
                        "surface-container": "#eceeee",
                        "primary-container": "#004d40",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffe16d",
                        "primary": "#00342b",
                        "on-tertiary-container": "#4b3e00",
                        "outline": "#707975",
                        "on-primary-fixed-variant": "#065043",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d8dada",
                        "inverse-on-surface": "#eff1f1",
                        "on-tertiary-fixed": "#221b00",
                        "primary-fixed": "#afefdd",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bfc9c4",
                        "on-secondary-fixed": "#00201e",
                        "secondary-container": "#bbe8e4",
                        "surface-tint": "#29695b",
                        "surface": "#f8fafa",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e1e3e3",
                        "on-secondary-fixed-variant": "#224e4b",
                        "secondary-fixed-dim": "#a2cfcb",
                        "on-secondary-container": "#3f6a67",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1d",
                        "surface-container-low": "#f2f4f4",
                        "surface-variant": "#e1e3e3",
                        "inverse-primary": "#94d3c1",
                        "on-primary-fixed": "#00201a",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#beebe7",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#544600",
                        "surface-container-high": "#e6e8e8",
                        "on-primary-container": "#7ebdac",
                        "inverse-surface": "#2e3131",
                        "tertiary-container": "#c8a900",
                        "secondary": "#3b6663",

                        "surface-bright": "#f8fafa",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#3f4945",
                        "primary-fixed-dim": "#94d3c1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "element-gap": "8px",
                        "stack-gap": "16px",
                        "section-padding": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "currency-md": ["Hanken Grotesk"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "balance-display": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "currency-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "balance-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .tonti-glow {
            box-shadow: 0px 8px 24px rgba(0, 77, 64, 0.08);
        }
        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #00342b;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased pb-[80px]">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md">
<div class="flex justify-between items-center h-16 px-container-margin w-full max-w-7xl mx-auto">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed">Selecionar Instituição</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-container-margin max-w-3xl mx-auto">
<!-- Header Section -->
<section class="mb-section-padding text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-element-gap">Conecte sua conta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Escolha de onde você quer trazer seus dados com segurança pelo Open Finance.</p>
</section>
<!-- Search Bar -->
<section class="mb-stack-gap">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-outline" data-icon="search">search</span>
<input class="w-full h-14 pl-12 pr-4 rounded-[16px] bg-[#F0F2F2] border-none font-body-md text-body-md text-on-surface placeholder:text-outline search-input transition-all" placeholder="Buscar instituição..." type="text"/>
</div>
</section>
<!-- Bank Grid -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-4">
<!-- Bank Item: Nubank -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-full bg-[#8A05BE] flex items-center justify-center text-white font-bold font-headline-md">N</div>
<span class="font-label-md text-label-md text-on-surface">Nubank</span>
</button>
<!-- Bank Item: Itaú -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-lg bg-[#EC7000] flex items-center justify-center text-white font-bold font-headline-md">I</div>
<span class="font-label-md text-label-md text-on-surface">Itaú</span>
</button>
<!-- Bank Item: Bradesco -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-full bg-[#CC092F] flex items-center justify-center text-white font-bold font-headline-md">B</div>
<span class="font-label-md text-label-md text-on-surface">Bradesco</span>
</button>
<!-- Bank Item: Santander -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-full bg-[#EC0000] flex items-center justify-center text-white font-bold font-headline-md">S</div>
<span class="font-label-md text-label-md text-on-surface">Santander</span>
</button>
<!-- Bank Item: Banco do Brasil -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-full bg-[#F9D70F] flex items-center justify-center text-[#003B70] font-bold font-headline-md">BB</div>
<span class="font-label-md text-label-md text-on-surface text-center">Banco do Brasil</span>
</button>
<!-- Bank Item: Caixa -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-full bg-[#005CA9] flex items-center justify-center text-white font-bold font-headline-md">C</div>
<span class="font-label-md text-label-md text-on-surface">Caixa</span>
</button>
<!-- Bank Item: Inter -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-full bg-[#FF7A00] flex items-center justify-center text-white font-bold font-headline-md">In</div>
<span class="font-label-md text-label-md text-on-surface">Inter</span>
</button>
<!-- Bank Item: C6 Bank -->
<button class="bg-surface-container-lowest rounded-[16px] p-4 flex flex-col items-center justify-center gap-3 tonti-glow hover:opacity-80 active:scale-95 transition-all aspect-square border border-surface-container">
<div class="w-12 h-12 rounded-full bg-[#242424] flex items-center justify-center text-white font-bold font-headline-md">C6</div>
<span class="font-label-md text-label-md text-on-surface">C6 Bank</span>
</button>
</section>
<!-- Other Institutions Section -->
<section class="mt-section-padding">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-stack-gap px-2">Outras instituições</h3>
<div class="bg-surface-container-lowest rounded-[16px] tonti-glow divide-y divide-surface-variant overflow-hidden">
<button class="w-full p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors active:scale-98">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<span class="font-body-md text-body-md text-on-surface">XP Investimentos</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors active:scale-98">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<span class="font-body-md text-body-md text-on-surface">BTG Pactual</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors active:scale-98">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Sicredi</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
</main>
<!-- Bottom Nav Bar (Suppressed on transactional/flow screens according to Semantic Shell Mandate) -->
<!-- Not rendering BottomNavBar because this is a 'Selecionar Instituição' flow page with a 'Back' action -->
</body></html>
