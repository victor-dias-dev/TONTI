<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tonti AI Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#e9c400",
                        "surface-container": "#eceeee",
                        "primary-container": "#004d40",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffe16d",
                        "primary": "#00342b",
                        "on-tertiary-container": "#4b3e00",
                        "outline": "#707975",
                        "on-primary-fixed-variant": "#065043",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d8dada",
                        "inverse-on-surface": "#eff1f1",
                        "on-tertiary-fixed": "#221b00",
                        "primary-fixed": "#afefdd",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bfc9c4",
                        "on-secondary-fixed": "#00201e",
                        "secondary-container": "#bbe8e4",
                        "surface-tint": "#29695b",
                        "surface": "#f8fafa",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e1e3e3",
                        "on-secondary-fixed-variant": "#224e4b",
                        "secondary-fixed-dim": "#a2cfcb",
                        "on-secondary-container": "#3f6a67",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1d",
                        "surface-container-low": "#f2f4f4",
                        "surface-variant": "#e1e3e3",
                        "inverse-primary": "#94d3c1",
                        "on-primary-fixed": "#00201a",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#beebe7",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#544600",
                        "surface-container-high": "#e6e8e8",
                        "on-primary-container": "#7ebdac",
                        "inverse-surface": "#2e3131",
                        "tertiary-container": "#c8a900",
                        "secondary": "#3b6663",
                        "background": "#f8fafa",
                        "tertiary": "#705d00",
                        "on-background": "#191c1d",
                        "surface-bright": "#f8fafa",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#3f4945",
                        "primary-fixed-dim": "#94d3c1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "element-gap": "8px",
                        "stack-gap": "16px",
                        "section-padding": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter", "sans-serif"],
                        "headline-md": ["Hanken Grotesk", "sans-serif"],
                        "headline-sm": ["Hanken Grotesk", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "currency-md": ["Hanken Grotesk", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "headline-lg": ["Hanken Grotesk", "sans-serif"],
                        "balance-display": ["Hanken Grotesk", "sans-serif"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "currency-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "balance-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .tonti-shadow {
            box-shadow: 0px 8px 24px rgba(0, 77, 64, 0.08);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md">
<div class="flex justify-between items-center h-16 px-container-margin w-full max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/30 flex-shrink-0">
<img alt="Profile photo of user" class="w-full h-full object-cover" data-alt="A polished, professional headshot of a young modern individual against a neutral bright background, highly detailed, photorealistic, optimistic mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDiCHhG1Ih3aIFjVepgsV4ChRR3QXKwq6LRJj8ndvFHqMr-7p14s0VnosjGnYMYEG02ALBccw__ciu8QiSG2AUfwpbZiYhl_Adk2xeAsCaWv3l7BdPazoptuONIomO6O4tvGzwpTbZV9xgsfL8UHCkHFF0G-8IbXpy7nSxlSO-9JtrCvnPC1Qzly9n_KBLly1XQOWRdv1px1nfut8yAzcnB2n3-0sPYIFkbY0U9h4ukuKslni-T170pTg"/>
</div>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed tracking-tight">Tonti</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Main Content Area (Chat Canvas) -->
<main class="flex-1 w-full max-w-7xl mx-auto px-container-margin pt-[88px] pb-[180px] flex flex-col gap-stack-gap">
<!-- Header -->
<div class="py-4">
<h1 class="font-headline-lg text-headline-lg text-primary">Seu assistente financeiro</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Inteligência a favor do seu bolso.</p>
</div>
<!-- Conversation History Area -->
<div class="flex flex-col gap-6">
<!-- AI Message 1 -->
<div class="flex gap-4 items-start w-full max-w-2xl">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center flex-shrink-0 tonti-shadow">
<span class="material-symbols-outlined text-on-primary-container">smart_toy</span>
</div>
<div class="flex flex-col gap-4 w-full">
<div class="bg-surface-container-lowest text-on-surface p-5 rounded-2xl rounded-tl-sm tonti-shadow">
<p class="font-body-lg text-body-lg">Oi! Analisei suas finanças deste mês.</p>
</div>
<!-- Visual Insight Cards (Bento-ish) -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full">
<!-- Insight 1: Alimentação (Positive) -->
<div class="bg-surface-container-lowest p-5 rounded-2xl tonti-shadow flex flex-col gap-3 border border-surface-variant/50 hover:-translate-y-1 transition-transform cursor-pointer">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container">restaurant</span>
</div>
<p class="font-body-md text-body-md font-medium text-primary">Gastou 18% menos com alimentação.</p>
</div>
<!-- Insight 2: Fatura (Warning/Negative) -->
<div class="bg-surface-container-lowest p-5 rounded-2xl tonti-shadow flex flex-col gap-3 border border-surface-variant/50 hover:-translate-y-1 transition-transform cursor-pointer">
<div class="w-10 h-10 rounded-full bg-error-container/40 flex items-center justify-center">
<span class="material-symbols-outlined text-error">credit_card</span>
</div>
<p class="font-body-md text-body-md font-medium text-on-surface">Fatura do cartão 12% maior.</p>
</div>
<!-- Insight 3: Guardar (Actionable/Positive) -->
<div class="bg-surface-container-lowest p-5 rounded-2xl tonti-shadow flex flex-col gap-3 border border-surface-variant/50 hover:-translate-y-1 transition-transform cursor-pointer relative overflow-hidden">
<div class="absolute -right-4 -bottom-4 opacity-5">
<span class="material-symbols-outlined text-9xl text-primary">savings</span>
</div>
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">savings</span>
</div>
<p class="font-body-md text-body-md font-medium text-primary relative z-10">Pode guardar R$ 650.</p>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Input Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-md border-t border-surface-variant/40 pb-safe z-40">
<div class="max-w-7xl mx-auto w-full flex flex-col gap-3 pt-3 pb-4 px-container-margin">
<!-- Quick Chips (Horizontal Scroll) -->
<div class="flex overflow-x-auto gap-2 hide-scrollbar pb-1">
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors active:scale-95">
                    Como estão minhas finanças?
                </button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors active:scale-95">
                    Onde estou gastando mais?
                </button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors active:scale-95">
                    Posso comprar isso?
                </button>
</div>
<!-- Input Field -->
<div class="flex items-end gap-3">
<div class="flex-1 bg-surface-container rounded-[24px] flex items-center px-4 py-1 min-h-[56px] focus-within:ring-2 focus-within:ring-primary focus-within:bg-surface-container-lowest transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md placeholder:text-outline py-3 px-1" placeholder="Pergunte sobre suas finanças..." type="text"/>
<button class="p-2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
<button class="w-[56px] h-[56px] rounded-[24px] bg-primary text-on-primary flex items-center justify-center flex-shrink-0 hover:opacity-90 active:scale-95 transition-all shadow-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</div>
</body></html>
